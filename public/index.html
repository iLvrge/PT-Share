<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/patentrack_favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
   
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <title>PatenTrack Share Illustration</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- Start of Meetings Embed Script -->
    <div class='MuiPopover-root' id="bookMeeting" style='visibility:hidden'>
      <div class="MuiBackdrop-root" aria-hidden="true" style="opacity: 1; transition: opacity 500ms cubic-bezier(0.4, 0, 0.2, 1) 0ms;"></div>
      <div tabindex="0" data-test="sentinelStart"></div>
      <div class='meeting-popup'>
        <div class="meetings-iframe-container" data-src="https://meetings.hubspot.com/uzi?embed=true"></div>
        <script type="text/javascript" src="https://static.hsappstatic.net/MeetingsEmbed/ex/MeetingsEmbedCode.js"></script>
      </div>
      <div tabindex="0" data-test="sentinelEnd"></div>
    </div>      
    <!-- End of Meetings Embed Script -->
  </body>
